[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-panel"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "bash build/build.sh"
test = "python -m pytest tests -q"
bench = "python bench/bench.py"

[activation.env]
PYTHONPATH = "python"

[dependencies]
mojo = "==1.2.0.dev2026092605"
max = ">=26.5.0.dev2026072406,<27"
python = "3.12.*"
pytest = "*"
numpy = "*"
pandas = "*"
