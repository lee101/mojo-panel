[project]
name = "mojo-panel"
version = "0.1.0"
description = "Panel (time x entity) feature kernels in Mojo: rolling statistics and cross-sectional ranking"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest", "pandas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/mojo_panel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
